AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Study Bunny cloud-api: an API Gateway HTTP API fronting six Node.js 24 Lambda
  functions that proxy Amazon Bedrock (Claude 3 Haiku). CORS is locked to a
  single AllowedOrigin (no wildcard), each function is granted only
  bedrock:InvokeModel on the configured model ARN, and no secret values are
  committed here. Model id and allowed origin are supplied as parameters at
  deploy time. SAM CLI is not run in this sandbox; `sam validate` runs at deploy.

# ---------------------------------------------------------------------------
# Parameters — no secret values. Supplied at `sam deploy --guided` time.
# ---------------------------------------------------------------------------
Parameters:
  BedrockModelId:
    Type: String
    Description: >
      Amazon Bedrock model id for the Claude 3 Haiku messages API, e.g.
      anthropic.claude-3-haiku-20240307-v1:0. Injected as BEDROCK_MODEL_ID and
      used to derive the least-privilege bedrock:InvokeModel resource ARN.
    Default: anthropic.claude-3-haiku-20240307-v1:0
    MinLength: 1
  AllowedOrigin:
    Type: String
    Description: >
      Exact frontend origin allowed by CORS, e.g. https://app.example.com. No
      wildcard is permitted. Injected as ALLOWED_ORIGIN for the CORS header.
    MinLength: 1
  LogRetentionInDays:
    Type: Number
    Description: CloudWatch Logs retention for every function log group.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

# ---------------------------------------------------------------------------
# Globals — shared Lambda runtime/config. Node.js 24 on all functions.
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 29
    Environment:
      Variables:
        # AWS_REGION is injected by the Lambda runtime; do not set it here.
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  # -------------------------------------------------------------------------
  # HTTP API — CORS restricted to the single AllowedOrigin (NO wildcard).
  # -------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'

  # -------------------------------------------------------------------------
  # Functions — one per route. Each model-backed function is granted only
  # bedrock:InvokeModel on the model ARN derived from BedrockModelId.
  # -------------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/health.handler
      Description: GET /api/health — liveness probe. No Bedrock access needed.
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/health

  SummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/summarize.handler
      Description: POST /api/summarize — study summary from anonymous text chunks.
      Policies:
        - Statement:
            - Sid: InvokeBedrockModelOnly
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        Summarize:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/summarize

  QuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/quiz.handler
      Description: POST /api/quiz — generates exactly 5 questions from chunks.
      Policies:
        - Statement:
            - Sid: InvokeBedrockModelOnly
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        Quiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/quiz

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/chat.handler
      Description: POST /api/chat — grounded answer with citation-ID validation.
      Policies:
        - Statement:
            - Sid: InvokeBedrockModelOnly
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/chat

  FeynmanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/feynman.handler
      Description: POST /api/feynman — evaluates an explanation against anonymous note chunks.
      Policies:
        - Statement:
            - Sid: InvokeBedrockModelOnly
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        Feynman:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/feynman

  AnalyzeTechniqueFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/analyzeTechnique.handler
      Description: POST /api/analyze-technique — recommends an in-scope study technique.
      Policies:
        - Statement:
            - Sid: InvokeBedrockModelOnly
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        AnalyzeTechnique:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/analyze-technique

  # -------------------------------------------------------------------------
  # Log groups — explicit retention per function (content-free diagnostics).
  # Names match the Lambda default log group so the function writes into them.
  # -------------------------------------------------------------------------
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: !Ref LogRetentionInDays

  SummarizeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SummarizeFunction}
      RetentionInDays: !Ref LogRetentionInDays

  QuizLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${QuizFunction}
      RetentionInDays: !Ref LogRetentionInDays

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatFunction}
      RetentionInDays: !Ref LogRetentionInDays

  FeynmanLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FeynmanFunction}
      RetentionInDays: !Ref LogRetentionInDays

  AnalyzeTechniqueLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyzeTechniqueFunction}
      RetentionInDays: !Ref LogRetentionInDays

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}/http-api
      RetentionInDays: !Ref LogRetentionInDays

# ---------------------------------------------------------------------------
# Outputs — publish the invoke URL to wire the frontend (VITE_API_BASE_URL).
# ---------------------------------------------------------------------------
Outputs:
  ApiBaseUrl:
    Description: >
      HTTP API invoke URL. Use as the frontend VITE_API_BASE_URL; routes live
      under /api (e.g. {ApiBaseUrl}/api/health).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  AllowedOrigin:
    Description: The single CORS origin this deployment permits.
    Value: !Ref AllowedOrigin
  BedrockModelId:
    Description: The Bedrock model id these functions are permitted to invoke.
    Value: !Ref BedrockModelId
